<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Moment for You</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family: Arial, Helvetica, sans-serif;
  color: #191919;

  background:
    linear-gradient(
      rgba(255,255,255,0.18),
      rgba(255,255,255,0.28)
    ),
    url("background.jpg");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.card {
  width: 90%;
  max-width: 580px;

  text-align: center;

  background: rgba(255,255,255,0.93);

  padding: 58px 45px;

  border-radius: 22px;

  border: 1px solid rgba(255,255,255,0.75);

  box-shadow:
    0 18px 50px rgba(0,0,0,0.13);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.top {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2.6px;
  color: #666666;
}

.line {
  width: 46px;
  height: 4px;

  background: #e65300;

  margin: 20px auto 34px;

  border-radius: 5px;
}

h1 {
  font-size: 32px;

  margin: 0 0 14px;

  line-height: 1.2;

  color: #191919;
}

.highlight {
  color: #e65300;
}

.intro {
  color: #666666;

  font-size: 16px;

  line-height: 1.6;

  margin-bottom: 30px;
}

.heart {
  color: #e65300;

  font-size: 29px;

  margin-bottom: 25px;
}

#message {
  font-size: 28px;

  line-height: 1.45;

  font-weight: bold;

  margin: 12px 0 40px;

  color: #191919;
}

.separator {
  width: 2px;
  height: 30px;

  background: #e65300;

  margin: 0 auto 24px;
}

.footer {
  color: #777777;

  font-size: 14px;

  line-height: 1.7;
}

.footer strong {
  color: #444444;
}

.bottom {
  margin-top: 38px;

  padding-top: 23px;

  border-top: 1px solid rgba(0,0,0,0.08);

  color: #888888;

  font-size: 11px;

  font-weight: bold;

  letter-spacing: 1.6px;
}

@media (max-width: 600px) {

  body {
    background-attachment: scroll;
  }

  .card {
    width: 92%;

    padding: 45px 26px;

    border-radius: 18px;
  }

  h1 {
    font-size: 27px;
  }

  #message {
    font-size: 23px;
  }

  .intro {
    font-size: 15px;
  }

}

</style>

</head>

<body>

<div class="card">

  <div class="top">
    A MOMENT FOR YOU
  </div>

  <div class="line"></div>

  <h1>
    This one is for <span class="highlight">you.</span>
  </h1>

  <div class="intro">

    Take a breath.

    <br>

    Maybe this is something you need to hear today.

  </div>

  <div class="heart">
    ♥
  </div>

  <div id="message"></div>

  <div class="separator"></div>

  <div class="footer">

    <strong>
      Keep this one with you today.
    </strong>

    <br>

    Maybe it was the reminder you needed.

  </div>

  <div class="bottom">

    KINDNESS • CONNECTION • PAUSE

  </div>

</div>


<script>

  "You are allowed to slow down.",

  "Just in case nobody told you today: you're doing a great job.",

  "You don't have to be perfect to be wonderful.",

  "Your best can look different from one day to another.",

  "Someone is grateful to have you in their life.",

  "One difficult moment doesn't make a difficult day.",

  "You bring more value than you probably realise.",

  "Give yourself the same patience you give to others.",

  "Pause. Breathe. Begin again.",

  "Your presence matters.",

  "Something good can still happen today.",

  "You don't need to have everything figured out.",

  "There is something special about being exactly who you are.",

  "It's okay if today feels a little heavier than yesterday.",

  "You make a difference in ways you may never get to see.",

  "There is no rush. One step is enough for now.",

  "You deserve good things too.",

  "Some days, simply showing up is enough.",

  "You are appreciated more than you know.",

  "It's okay to ask for help. You don't have to do everything alone.",

  "Today doesn't need to be perfect to be a good day.",

  "You matter beyond your deadlines and your to-do list.",

  "A small win is still worth celebrating.",

  "You deserve the same kindness you give so freely to others.",

  "You are allowed to protect your energy.",

  "Be proud of the things you handled that nobody else saw.",

  "Just a reminder: you are enough.",

  "It's okay to pause before moving on.",

  "Some things can wait. Take care of yourself too.",

  "You're allowed to have a difficult day.",

  "Don't underestimate the progress nobody else can see.",

  "You don't need to be at 100% every day.",

  "There is strength in knowing when to pause.",

  "You are more than your productivity.",

  "A little rest can make tomorrow feel lighter.",

  "Give yourself credit for how far you've come.",

  "You don't need to earn your rest.",

  "It's okay if all you can do today is your best.",

  "Never forget how much you have to offer.",

  "Celebrate the small things. They matter.",

document.getElementById("message").textContent =
  messages[randomIndex];

</script>


</body>

</html>
